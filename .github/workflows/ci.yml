name: CI

# Why this exists: the component repos were created from a template that
# shipped only release.yml, so nothing ever ran `go test` on a pull
# request. A `crypto/rand: argument to Int is <= 0` panic in the
# template's own retry-backoff helper survived unnoticed into two
# generations of copies because of it — the test that caught it was
# already written and already red, and nobody saw it. So: build, vet and
# test every module on every push and PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Three independent Go modules. `go build ./...` at the repo root
        # does NOT cover them — there is no root module, by design — so
        # each is built and tested in its own working directory.
        module: [api, plugin, service]
    name: ${{ matrix.module }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      # The `service` module replaces github.com/FerretDB/FerretDB with the
      # PRIVATE fork github.com/simple-container-com/go-embedb, so even
      # `go build` needs a read credential — the replace is resolved while
      # loading the module graph, long before any build tag or env var is
      # consulted. Decrypted from this repo's SC registry with the single
      # org-level SC_CONFIG. A PR from a fork gets no secret and fails
      # loudly on the `test -s` guard below. api/ and plugin/ don't have
      # the private dep, so the step is conditional.
      - uses: simple-container-com/actions/install-sc@main
        if: matrix.module == 'service'
      - name: Reveal the go-embedb deploy key
        if: matrix.module == 'service'
        working-directory: .
        env:
          SIMPLE_CONTAINER_CONFIG: ${{ secrets.SC_CONFIG }}
        run: |
          set -euo pipefail
          sc secrets reveal --force
          test -s .sc/deploy-keys/go-embedb.pem
          # `sc secrets reveal` writes 0644. ssh refuses a world-readable
          # private key outright ("bad permissions") and then reports the
          # fetch as `Permission denied (publickey)`, which reads like the
          # wrong key rather than the wrong mode.
          chmod 600 .sc/deploy-keys/go-embedb.pem

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go build
        env:
          # Keeps the private module off the public proxy (which cannot
          # read it and reports git's auth failure as a misleading
          # `invalid version`) and off the checksum database.
          GOPRIVATE: github.com/simple-container-com/*
        run: |
          set -euo pipefail
          if [ "${{ matrix.module }}" = "service" ]; then
            git config --global url."git@github.com:".insteadOf "https://github.com/"
            export GIT_SSH_COMMAND="ssh -i ${GITHUB_WORKSPACE}/.sc/deploy-keys/go-embedb.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          fi
          go build ./...

      # `go vet` compiles test packages, which `go build ./...` does not.
      # That difference is not academic: adding a method to an interface
      # leaves every fake in a _test.go file unimplementing it, and a
      # build-only gate ships that happily.
      - name: go vet
        env:
          GOPRIVATE: github.com/simple-container-com/*
        run: |
          set -euo pipefail
          if [ "${{ matrix.module }}" = "service" ]; then
            export GIT_SSH_COMMAND="ssh -i ${GITHUB_WORKSPACE}/.sc/deploy-keys/go-embedb.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          fi
          go vet ./...

      - name: go test
        env:
          GOPRIVATE: github.com/simple-container-com/*
        run: |
          set -euo pipefail
          if [ "${{ matrix.module }}" = "service" ]; then
            export GIT_SSH_COMMAND="ssh -i ${GITHUB_WORKSPACE}/.sc/deploy-keys/go-embedb.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          fi
          go test ./... -count=1

      # -race only on the service module: it is the one with concurrency
      # (the delivery drain's single-flight lease), and it is the one
      # where a data race would mean duplicate notifications.
      - name: go test -race
        if: matrix.module == 'service'
        env:
          GOPRIVATE: github.com/simple-container-com/*
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i ${GITHUB_WORKSPACE}/.sc/deploy-keys/go-embedb.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          go test ./... -count=1 -race

  # Asserts the tests actually catch the faults they claim to. See
  # hack/mutation-check.py — it breaks one guard at a time and requires
  # the matching test to go red. This is what distinguishes a regression
  # test from a test that merely agrees with the code as written; it has
  # already found two tests that passed with their guard removed.
  mutation-check:
    runs-on: ubuntu-latest
    name: mutation check
    steps:
      - uses: actions/checkout@v4

      # service's private go-embedb dep needs the reveal to resolve.
      # Same credential path as the `service` matrix cell above.
      - uses: simple-container-com/actions/install-sc@main
      - name: Reveal the go-embedb deploy key
        env:
          SIMPLE_CONTAINER_CONFIG: ${{ secrets.SC_CONFIG }}
        run: |
          set -euo pipefail
          sc secrets reveal --force
          test -s .sc/deploy-keys/go-embedb.pem
          chmod 600 .sc/deploy-keys/go-embedb.pem

      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      # Warm the build cache once per module, so the one `go test -run`
      # call per mutation (111 of them today) doesn't each pay for a cold
      # compile. Both modules: the harness mutates service/ and plugin/.
      #
      # Non-fatal on purpose: this step only warms a cache, and the
      # mutation loop re-fetches whatever is missing. Gating the job on it
      # turns a module-proxy hiccup into a red PR — which is exactly what
      # happened the first time it ran (run 45185637530: proxy.golang.org
      # answered INTERNAL_ERROR mid-zip for antonmedv/expr).
      - name: prime build cache
        continue-on-error: true
        env:
          GOPRIVATE: github.com/simple-container-com/*
          GIT_SSH_COMMAND: ssh -i ${{ github.workspace }}/.sc/deploy-keys/go-embedb.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: |
          set -euo pipefail
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          (cd service && go test ./... -count=1 -run XXXNONE)
          (cd plugin  && go test ./... -count=1 -run XXXNONE)

      - name: mutation check
        env:
          GOPRIVATE: github.com/simple-container-com/*
          GIT_SSH_COMMAND: ssh -i ${{ github.workspace }}/.sc/deploy-keys/go-embedb.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
        run: python3 hack/mutation-check.py

      # A mutation that is written back incorrectly would leave the tree
      # dirty. Cheap insurance against the harness itself lying.
      - name: tree restored
        run: git diff --exit-code

  format:
    runs-on: ubuntu-latest
    name: gofumpt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      # Advisory, not blocking: this repo has no .golangci.yml, so
      # gofumpt is a convention here rather than an enforced gate, and
      # failing a PR on comment alignment would be noise. It prints the
      # offenders so they get fixed in passing.
      - name: gofumpt -l
        continue-on-error: true
        run: |
          out=$(gofumpt -l api plugin service)
          if [ -n "$out" ]; then
            echo "::warning::unformatted files:"
            echo "$out"
            exit 1
          fi
          echo "all formatted"
