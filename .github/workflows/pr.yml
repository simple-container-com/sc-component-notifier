name: PR

# The gate this repo did not have.
#
# `release.yml` triggers only on a push to main (or a `v*` tag), so until
# now NOTHING built the service image or ran its tests before a merge.
# That is how sc-component-observatory landed a `replace` pointing at a
# sibling checkout that exists on exactly one operator's laptop: `main`
# went red on the first post-merge Release, the image stream stopped,
# and the only way back was a revert. A `go mod download` failure is
# cheap to catch and expensive to discover after merge — so catch it
# here.
#
# Three jobs, deliberately:
#   - service-test — `go test ./...` in service/. Needs the go-embedb
#     deploy key.
#   - plugin-test  — `go test ./...` in plugin/. No private deps, no
#     credentials; the plugin's config contract (Schema + the declared
#     ComponentSecretEnvMap) is the component's published API and its
#     tests should run on every PR.
#   - image        — `docker build` on service/. Same inputs as release.yml
#     minus `push`, so a green image job means the release build will
#     reach the registry.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  service-test:
    name: Build + test the service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # service/go.mod routes github.com/FerretDB/FerretDB to the PRIVATE
      # fork github.com/simple-container-com/go-embedb, so even `go build`
      # needs a read credential — the replace is resolved while loading
      # the module graph, long before any build tag or env var is
      # consulted.
      #
      # Decrypted from this repo's own SC registry with the single
      # org-level SC_CONFIG. A pull request from a FORK gets no secret
      # and fails loudly on the `test -s` below, which is the right
      # direction: these are private repos and every PR is branch-based.
      - uses: simple-container-com/actions/install-sc@main
      - name: Reveal the go-embedb deploy key
        env:
          SIMPLE_CONTAINER_CONFIG: ${{ secrets.SC_CONFIG }}
        run: |
          set -euo pipefail
          sc secrets reveal --force
          test -s .sc/deploy-keys/go-embedb.pem
          # `sc secrets reveal` writes 0644. ssh refuses a
          # world-readable private key outright ("bad permissions") and
          # then reports the fetch as `Permission denied (publickey)`,
          # which reads like the wrong key rather than the wrong mode.
          chmod 600 .sc/deploy-keys/go-embedb.pem

      - uses: actions/setup-go@v5
        with:
          # From go.mod rather than a literal, so the toolchain never
          # drifts from what the Dockerfile and the operators build with.
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      # `go test`, not `go build`: `go build ./...` does not compile test
      # packages, so it happily ships a tree whose _test.go files no
      # longer build (fleet CLAUDE.md records the round-trip this cost).
      - name: Test
        working-directory: service
        env:
          # Keeps the private module off the public proxy (which cannot
          # read it and reports git's auth failure as a misleading
          # `invalid version`) and off the checksum database.
          GOPRIVATE: github.com/simple-container-com/*
        run: |
          set -euo pipefail
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          export GIT_SSH_COMMAND="ssh -i ${GITHUB_WORKSPACE}/.sc/deploy-keys/go-embedb.pem -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          go test ./... -count=1
          # A dirty go.mod/go.sum after a build means the committed pins
          # do not describe the module graph — the next CI run would
          # resolve something different.
          git diff --exit-code go.mod go.sum

  plugin-test:
    name: Test the plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      # No `sc secrets reveal` and no GIT_SSH_COMMAND: plugin/go.mod
      # replaces the sibling `api` module with `../api` (a path in this
      # checkout) and its only other simple-container dependency is the
      # public `simple-container-com/api`. If a private dep is ever
      # added here, this job starts failing in `go mod download` and the
      # fix is to copy the reveal + GOPRIVATE block from the service job
      # above.
      - name: Test
        working-directory: plugin
        run: |
          set -euo pipefail
          go test ./... -count=1
          git diff --exit-code go.mod go.sum

  image:
    name: Build the service image (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This job's whole value is being a dry run of release.yml's image
      # build, and that only holds while the two pass the same build
      # inputs. They diverged once: the go-embedb private dep landed
      # with the reveal + `go_embedb_key` secret here and in ci.yml but
      # NOT in release.yml, so this job stayed green on PR #2 and the
      # release that merged it failed in `go mod download` after
      # publishing the GitHub Release and every binary. A green dry run
      # that cannot predict the real build is worse than no dry run, so
      # assert the mount exists on both sides rather than trusting the
      # comment that says they match.
      - name: release.yml mounts the same build secret as this job
        run: |
          set -euo pipefail
          for wf in pr.yml release.yml; do
            grep -q 'go_embedb_key=\.sc/deploy-keys/go-embedb\.pem' ".github/workflows/$wf" || {
              echo "::error file=.github/workflows/$wf::does not mount go_embedb_key for the service image build — service/go.mod needs the private go-embedb module and the build will fail on 'git@github.com: Permission denied (publickey)'"
              exit 1
            }
          done

      - uses: simple-container-com/actions/install-sc@main
      - name: Reveal the go-embedb deploy key
        env:
          SIMPLE_CONTAINER_CONFIG: ${{ secrets.SC_CONFIG }}
        run: |
          set -euo pipefail
          sc secrets reveal --force
          test -s .sc/deploy-keys/go-embedb.pem
          chmod 600 .sc/deploy-keys/go-embedb.pem

      - uses: docker/setup-buildx-action@v3

      # Same inputs as the release build minus `push`, so a green run
      # here means the release build will get as far as the registry.
      # amd64 only, for the reason release.yml records (arm64 under
      # QEMU: ~25 min).
      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: service
          file: service/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: |
            go_embedb_key=.sc/deploy-keys/go-embedb.pem
          build-args: |
            VERSION=0.0.0-pr
            COMMIT=${{ github.sha }}
            REVISION=${{ github.sha }}
