name: Release

# Cuts plugin binaries + the service image for every release.
#
# Two triggers:
#   - push to main → auto-release with CalVer "vYYYY.MM.DD-<short-sha>".
#   - manually-pushed "v*" tag → named release for pinning / rollback.
#
# Both paths produce the same artifact set: three PLUGIN binaries
# (linux/amd64, linux/arm64, darwin/arm64), a sha256sums.txt, a GitHub
# Release, and a Dockerhub push of the service image.
#
# Both halves are required for a deploy: SC pulls the PLUGIN from the
# GitHub release (`source: {type: github-release}` in server.yaml) and
# the SERVICE image from Dockerhub by the pin in the Component's
# `image:` field. A release that produces only one of the two leaves
# the component un-deployable, which is why they live in one workflow.
#
# Dockerhub publish into the shared simplecontainer/* namespace was
# approved by the operator with this component's plan (2026-11-23),
# the same way it was for sc-component-observatory.
#
# OOM pins (GOMAXPROCS=1, GOMEMLIMIT=6GiB, `go build -p 1`) — kept
# verbatim from sc-plugin-echo even though sc-component-notifier's plugin
# imports no large Pulumi SDK today. Four of six existing SC plugin
# repos learned this lesson the hard way; a derived component plugin
# that adds a cloud SDK later will need these pins and the workflow
# shouldn't gate on knowing in advance.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      is_tag:  ${{ steps.compute.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: compute
        name: Resolve version string
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true"               >> "$GITHUB_OUTPUT"
          else
            ver="v$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
            echo "version=${ver}"            >> "$GITHUB_OUTPUT"
            echo "is_tag=false"              >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: plugin/go.sum

      - name: Build plugin binary
        working-directory: plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.version.outputs.version }}
          # OOM-safe pins — see workflow file-level comment.
          GOMAXPROCS: '1'
          GOMEMLIMIT: '6GiB'
        run: |
          out=sc-component-notifier-${GOOS}-${GOARCH}
          go build -trimpath -buildvcs=false -p 1 \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../${out}" \
            ./cmd/sc-component-notifier
          sha256sum "../${out}" > "../${out}.sha256"
          tar -czf "../${out}.tar.gz" "../${out}"
          sha256sum "../${out}.tar.gz" >> "../${out}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            sc-component-notifier-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build consolidated sha256sums.txt
        working-directory: dist
        run: |
          cat sc-component-notifier-*.sha256 > sha256sums.txt
          rm sc-component-notifier-*.sha256
          cat sha256sums.txt

      - name: Tag commit if from main
        if: needs.version.outputs.is_tag == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            dist/*

  # Dockerhub publish. Ported from sc-component-observatory's job,
  # which is the working reference — including its `if:`, but NOT its
  # comment: observatory's says "tag push only" and the condition it
  # sits above fires on main pushes too (`is_tag == 'false'` IS the
  # main-push branch). The behaviour here is the honest reading of that
  # condition — every main push republishes the image under a fresh
  # CalVer pin and moves :latest. That is what we want while the
  # component is pre-v1 and the operator config pins an exact version
  # anyway.
  #
  # Image name: simplecontainer/sc-component-notifier:<version>, plus
  # :latest. Builds from the `service/` module and passes VERSION as a
  # build arg so `-X main.version=<ver>` resolves (fleet convention,
  # root CLAUDE.md "How SC builds images" — SC always injects VERSION,
  # so a deployed binary reporting 0.0.0 is a bug, not the norm).
  docker:
    name: Push Docker image to Dockerhub
    runs-on: ubuntu-latest
    needs: [version, release]
    if: startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.is_tag == 'false'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Fleet-shared Dockerhub login: pulls simplecontainer:dockerhub-cicd-token
      # from the api repo's SC secrets registry via the single ORG-LEVEL
      # SC_CONFIG secret (visibility=all, so this repo inherits it with no
      # per-repo wiring). One place to rotate. Never add a repo-level
      # SC_CONFIG — it would SHADOW the org value and go stale.
      - uses: simple-container-com/actions/install-sc@main
      - uses: simple-container-com/actions/dockerhub-login@main
        with:
          sc-config: ${{ secrets.SC_CONFIG }}

      - uses: docker/setup-buildx-action@v3

      # `cache-to: mode=max` writes every stage, so a subsequent run
      # reuses the two slow phases: the SPA's `npm install` and the Go
      # builder's `go mod download`.
      #
      # Platform: amd64 ONLY. arm64 under QEMU emulates the whole Node
      # build at ~1/10th native speed, and observatory measured ~25 min
      # for a single multi-arch release. A Lambda deploy picks ONE arch
      # per function, so emitting both buys nothing today.
      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          context: service
          file: service/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
            REVISION=${{ github.sha }}
          tags: |
            simplecontainer/sc-component-notifier:${{ needs.version.outputs.version }}
            simplecontainer/sc-component-notifier:latest
